<script>
// Tema settes før første tegning, ellers farger Safari topplinjen hvit og beholder den.
function sunTimes(date, lat = 59.91, lng = 10.75) { // SunCalc-formelen, kun opp/ned
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009, e = rad * 23.4397;
  const d = date.valueOf() / 864e5 - 0.5 + J1970 - J2000, lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds), L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const fromJ = j => new Date((j + 0.5 - J1970) * 864e5);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}
function applyTheme() {
  var th = null; try { th = JSON.parse(localStorage.getItem('theme')); } catch (e) {}
  th = th || 'dark';
  if (th === 'auto') { var now = new Date(), s = sunTimes(now); th = now < s.rise || now > s.set ? 'dark' : 'light'; }
  document.documentElement.dataset.theme = th;
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = th === 'dark' ? '#000000' : '#ffffff';
}
applyTheme();
// I nettleseren (ikke Hjem-skjerm) er topplinjen festet glass som i appen. Safari 26 viser bare én flat farge bak klokka (sidens html-bakgrunn),
// så glasset starter i den fargen øverst og går over i glass nedover. Bildet vises aldri bak klokka. Se rapporten «Safari 26 topplinje og statusfelt».
document.documentElement.classList.toggle('inbrowser', !(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true));
</script>

.prow b{display:block;font-weight:500;font-size:15px}.prow small{display:block;font-size:12px;color:var(--muted)}
.call{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--blue)}
.call svg{width:18px;height:18px;fill:var(--blue-soft)}
.call.off{opacity:.3;pointer-events:none}
.mrowm{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:500;font-size:13px}
.mrowm span{color:var(--muted);font-weight:700;font-size:18px}
.mgap{height:8px}
.msg{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.msg .k{font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--blue-soft)}.msg p{font-size:13px;line-height:1.35}.msg small{font-size:11px;color:var(--muted)}
.manual{font-size:15px;line-height:1.5}
.manual h2,.manual h3,.manual h4{font-family:"Archivo Black";font-weight:400;text-transform:none;margin:18px 0 6px}.manual h2{font-size:20px}.manual h3{font-size:17px}.manual h4{font-size:15px}
.manual p{margin:0 0 10px}.manual ul,.manual ol{margin:0 0 10px;padding-left:22px}.manual li{margin:4px 0}.manual li.done{text-decoration:line-through;color:var(--muted)}
.manual .callout{border:1.5px solid var(--blue);padding:10px 12px;margin:0 0 10px}.manual blockquote{border-left:3px solid var(--chip);padding-left:12px;color:var(--muted);margin:0 0 10px}
.manual hr{border:0;border-top:1px solid var(--line);margin:14px 0}.manual img{max-width:100%;height:auto;display:block;margin:8px 0}
.manual pre{background:var(--line);padding:10px;overflow-x:auto;font-size:13px}.manual code{background:var(--line);padding:1px 4px}.manual a{color:var(--blue-soft)}.manual details{margin:0 0 10px}.manual summary{font-weight:700;cursor:pointer}.manual .muted{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1.5px solid var(--blue);padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.modal .ph h2{text-transform:uppercase}
.codein{display:flex;gap:10px}
.codein input{flex:1;font:inherit;font-family:"Archivo Black";font-size:28px;text-align:center;color:inherit;background:none;border:1.5px solid var(--field);padding:14px 0;letter-spacing:.3em;min-width:0}
.codein input:focus{outline:none;border-color:var(--blue)}
.ta{font:inherit;font-size:15px;color:inherit;background:none;border:1px solid var(--field);padding:14px;min-height:110px;width:100%;resize:vertical}
.ta:focus{outline:none;border-color:var(--blue)}
.ghost{border:1px solid var(--chip);padding:12px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1.5px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-family:"Archivo Black";font-weight:400;font-size:28px;line-height:1}
.stat span{font-weight:700;font-size:12px}
.stat small{font-size:11px;color:var(--muted);line-height:1.3}

/* ---- felles småting ---- */
[hidden]{display:none!important}
.wordmark,.join-d,.foot{display:none}
.nblock{display:flex;flex-direction:column;gap:14px}
#pSync{display:none}
.calblock{display:none}
.calmenu{position:absolute;z-index:9;width:320px;background:var(--panel);border:1.5px solid var(--blue);display:flex;flex-direction:column;padding:6px;box-shadow:0 16px 48px rgba(0,0,0,.35);transform-origin:top left;animation:pop .18s cubic-bezier(.32,.72,0,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.calmenu a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-decoration:none;color:inherit}
.calmenu a:hover{background:var(--blue);color:#fff}
.calmenu b{font-weight:700;font-size:14px}
.calmenu small{font-size:12px;color:var(--muted)}
.calmenu a:hover small{color:#fff;opacity:.85}
.hear{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:12px;letter-spacing:.06em}
.hear i{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.hear svg{width:11px;height:12px;fill:#fff;margin-left:2px}
.mnote{display:inline-block;width:13px;height:13px;margin-left:7px;vertical-align:-1px;fill:var(--blue-soft)}
.mcover{width:min(240px,62vw);aspect-ratio:1;object-fit:cover;align-self:center;border-radius:12px;background:var(--line)}
.mtitle{font-family:"Archivo Black";font-size:22px;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.martist{font-weight:500;font-size:14px;color:var(--muted);text-align:center;margin-top:-6px}
.membed{border-radius:12px;overflow:hidden;background:var(--line)}
.membed iframe{display:block;width:100%;border:0}
/* Arrangementsarket (forslag A «Bunnark», Georg 27.10.2026): trykk på kortet for valgt dag. Samme ark som musikken, med plakaten øverst. */
.sheet.event>.grip{display:none}
.sheet.event .sbody{padding:0;gap:0}
.poster{position:relative;flex:none;aspect-ratio:2/1;overflow:hidden;background:radial-gradient(110% 130% at 0% 120%,rgba(0,0,255,.5) 0%,rgba(0,0,255,0) 58%),linear-gradient(160deg,#1d1d1d 0%,#050505 72%)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:"";position:absolute;inset:0 0 auto;height:72px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));pointer-events:none}
.poster .grip{position:absolute;top:0;left:0;right:0;z-index:1}
.poster .grip i{background:rgba(255,255,255,.8)}
.ex{position:absolute;top:10px;right:10px;z-index:1;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.etx{padding:18px 20px 0;display:flex;flex-direction:column;gap:8px}
.etx .d{font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--blue-soft);text-transform:uppercase}
.etx h2{font-size:34px;line-height:.92;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.etx .ty{font-weight:500;font-size:14px;color:var(--muted);margin-top:-2px}
.etx .info{font-size:15px;line-height:1.45;opacity:.85;white-space:pre-line;margin-top:6px}
.emusic{padding:20px 20px 0;display:flex;flex-direction:column;gap:10px}
.emh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.emh .lbl2{font-size:11px}
.emh .linkbtn{font-size:12px}
.efoot{position:sticky;bottom:0;display:flex;gap:10px;padding:18px 20px calc(env(safe-area-inset-bottom) + 16px);background:var(--panel)}
.sheet.event .efoot .btn.primary{flex:1}
.cbrow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left}
.cbrow input{width:20px;height:20px;accent-color:var(--blue);margin-top:1px;flex:none}
.cbrow b{display:block;font-weight:700;font-size:14px}
/* ---- PC (PC 1: Plakat, bredformat). Under 900 px er alt over urørt. ---- */
@media (min-width:900px){
.wrap,.chrome{max-width:none}
.chrome{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 40px}
.wordmark{display:block;justify-self:start;font-family:"Archivo Black";font-size:14px;letter-spacing:.14em}
.brand{justify-self:center}
.brand button{flex-direction:column;align-items:center;gap:6px}
.brand .logo{height:52px}
.brand-pc{display:flex;flex-direction:column;align-items:center;gap:3px}
.brand-pc small{font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1}
#join{display:none}
.join-d{display:inline-block;background:none;color:var(--fg);border:1px solid var(--chip);font-family:"Space Grotesk";font-weight:700;font-size:12px;letter-spacing:.06em;padding:10px 16px}
.tools{justify-self:end;gap:16px}
.hero{height:720px;min-height:0;max-height:none}
.hero .tx{left:64px;right:64px;bottom:56px;gap:16px}
.hero h1{font-size:96px}
.hero .meta{font-size:16px}
.hero .info{max-width:640px;font-size:17px}
.hero.noimg{padding-top:120px}
.hero.noimg .gen{height:min(300px,100%)}
.hero.noimg .tx{padding:0 80px 56px}
.content{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:64px;row-gap:48px;padding:40px 64px 64px;align-items:start} /* 60/40: høyre spalte skvises ikke på smale PC-skjermer */
.desc{grid-column:1;grid-row:1}
#actions{grid-column:2;grid-row:1;justify-self:end}
#actions:empty{display:none}
.cal{grid-column:1;grid-row:2/4;align-self:stretch}
.list{grid-column:2;grid-row:2}
.cta{grid-column:2;grid-row:3;align-self:end;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:16px 20px;min-height:92px;box-sizing:border-box} /* bare i høyre spalte, nederst i flukt med kalenderen */
.cta b{font-size:15px;margin:0}
.cta span{font-size:13px}
.foot{grid-column:1/3;grid-row:4}
.btn.primary{flex:none;padding:16px 28px}
.btn.ghost{padding:16px 22px}
.grid{gap:6px}
.day{height:64px;font-size:16px}
.cal-head h2{font-size:26px}
.list h2{font-size:18px}
.foot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px;border-top:1px solid var(--line);padding-top:32px;font-size:14px}
.foot b{display:block;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.foot a{color:inherit;text-decoration:none}
.panel{width:400px;padding:36px 28px 32px}
/* PC får ikke push: varselvalgene vises bare innlogget, og styrer da telefonen via kontoen */
.nblock{display:none}
body.member .nblock{display:flex}
body.member .nblock .dev{display:none}
body.member #pSync{display:block}
.calblock{display:flex}
#home.view{display:block}
#forslag.view.on{position:fixed;inset:0;z-index:14;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--scrim);overflow:auto;padding:40px}
#forslag .top,#forslag .form{width:600px;max-width:100%;background:var(--panel);border:1px solid var(--line)}
#forslag .top{padding:28px 36px 0;border-bottom:0;flex-direction:row-reverse;justify-content:space-between}
#forslag .top h2{font-size:34px;line-height:.92;letter-spacing:-.01em}
#back{font-size:0}
#back::after{content:"×";font-size:26px;color:var(--muted);line-height:1}
#forslag .form{padding:16px 36px 36px;border-top:0}
.form h1{display:none}
body:has(#forslag.on){overflow:hidden}
.pill{left:40px;transform:none;bottom:24px}
.pill.hide{transform:translateY(120px)}
.sheet{--sx:0;left:40px;width:720px;max-width:720px;bottom:96px;max-height:calc(100dvh - 120px);border-radius:0;border:1px solid var(--line);box-shadow:0 16px 48px rgba(0,0,0,.45);transform:translate(0,calc(100% + 100px))}
.sheet.open{transform:translate(0,0)}
.grip{display:none}
.sbody{padding:28px 32px 28px}
body.member .content{padding-bottom:64px}
.modal .box{max-width:420px}
.sheet.music{left:50%;right:auto;top:50%;bottom:auto;width:480px;max-width:calc(100vw - 48px);max-height:calc(100dvh - 80px);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .2s} /* PC: musikken er en dialog midt på skjermen */

.sheet.music .grip{display:none}
}

function head(title, sub, back) { return `<div class="shead">${back ? `<button class="back" data-back>←</button>` : ''}<div style="flex:1;min-width:0"><h2 class="${title.length > 18 ? 'long' : ''}">${title}</h2>${sub ? `<small>${sub}</small>` : ''}</div><button class="x" data-close>×</button></div>`; }
function tabsHtml() { return `<div class="stabs">${['vakter', 'manualer', 'meldinger'].map((k, i) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t('tabs')[i]}</button>`).join('')}</div>`; }
function renderSheet() {
  const b = $('#sbody'); const H = S.home; const v = S.view;
  if (!S.member) { b.innerHTML = ''; return; }
  if (!H) { b.innerHTML = head(t('hi') + first(S.member.name).toUpperCase(), t('loading')) + tabsHtml(); return; }
  const up = H.shifts.filter(s => s.date >= H.today || isActiveShift(s));
  if (v?.type === 'shift') { const s = H.shifts.find(x => x.id === v.id); if (!s) { S.view = null; return renderSheet(); }
    const person = (p, role) => `<div class="prow"><div><b>${p.name}</b>${role ? `<small>${role}</small>` : ''}</div><a class="call${p.phone ? '' : ' off'}" href="${tel(p.phone)}" aria-label="Ring ${p.name}">${ICON_CALL}</a></div>`;
    const man = title => H.manuals.find(mm => new RegExp(title, 'i').test(mm.title));
    b.innerHTML = head(fmt(s.date, { weekday:'short', day:'numeric', month:'short' }).toUpperCase(), `${roleName(s.role)}, kl ${s.time}. ${s.event || s.pub || ''}`, true)
      + (s.obs ? `<div class="tcard"><span class="k">${t('obsK')}</span><p>${s.obs}</p></div>` : '')
      + `<div class="lbl2">${t('responsible')}</div>` + (s.responsible ? person(s.responsible, s.responsible.role) : `<p class="hint">${t('alone')}</p>`)
      + `<div class="lbl2">${t('workWith')}${s.role === 'resp' ? ', ' + roleName('open').toUpperCase() + ' 19-22' : ''}</div>` + (s.coworkers.length ? s.coworkers.map(p => person(p, roleName(s.coRole || s.role) + ' ' + (s.coRole === 'open' ? '19-22' : s.time))).join('') : `<p class="hint">${t('alone')}</p>`)
      + `<div class="lbl2">${t('otherTeam')}${roleName(s.otherRole).toUpperCase()} ${s.otherRole === 'open' ? '19-22' : '22-01'}</div>` + (s.others.length ? s.others.map(p => person(p)).join('') : `<p class="hint">${t('alone')}</p>`)
      + `<div style="display:flex;justify-content:space-between;gap:10px">${man('skifte vakt') ? `<button class="linkbtn" data-manual="${man('skifte vakt').id}">Skifte vakt ›</button>` : ''}${man(s.role === 'open' ? 'åpne' : 'låse') ? `<button class="linkbtn" data-manual="${man(s.role === 'open' ? 'åpne' : 'låse').id}">${man(s.role === 'open' ? 'åpne' : 'låse').title} ›</button>` : ''}</div>`;
    return; }
  if (v?.type === 'manual') { b.innerHTML = head(v.title || t('tabs')[1], t('manualsS'), true) + `<div class="manual" id="manualBody">${v.html || `<p class="muted">${t('loading')}</p>`}</div>`;
    if (!v.html) api('/api/member/manual/' + v.id).then(r => { if (S.view?.id === v.id) { S.view = { ...v, title: r.data.title || v.title, html: r.ok ? r.data.html : `<p class="muted">${t('errNet')}</p>` }; renderSheet(); } }); return; }
  if (v?.type === 'send') return renderSend(b);
  if (v?.type === 'log') return renderLog(b);
  if (v?.type === 'code') return renderCode(b);
  if (v?.type === 'stats') return renderStats(b);
  let html = head(t('hi') + first(S.member.name).toUpperCase(), up.length === 0 ? t('noShifts') : up.length === 1 ? t('oneShift') : up.length + t('nShifts')) + tabsHtml();
  if (S.tab === 'vakter') {
    const active = up.find(isActiveShift); const latest = H.messages.find(m => Date.now() - m.t < 48 * 3600e3);
    if (active && active.obs) html += `<div class="tcard bounce"><span class="k">${t('obsK')}</span><p>${active.obs}</p></div>`;
    else if (latest) html += `<button class="tcard" data-tab="meldinger"><span class="k">${t('fromBoard')}${fmt(new Date(latest.t), { day:'numeric', month:'short' }).toUpperCase()}</span><p>${latest.text}</p></button>`;
    const nx = active || up[0];
    if (nx) html += `<button class="scard" data-shift="${nx.id}"><span class="chip${active ? ' now' : ''}">${active ? t('nowShift') : t('nextShift')}</span><h3>${fmt(nx.date, { weekday:'short', day:'numeric', month:'short' })}</h3><span class="t">${roleName(nx.role)}, kl ${nx.time}</span><p>${shiftSub(nx)} ${t('tapDetail')}</p></button>`;
    html += up.filter(s => s !== nx).map(s => `<button class="srow" data-shift="${s.id}"><span class="d">${fmt(s.date, { day:'numeric', month:'short' })}</span><span class="t"><b>${roleName(s.role)}</b><span>Kl ${s.time}, ${s.event || s.pub || t('noProgramS')}</span></span><span class="a">›</span></button>`).join('');
    html += `<a class="wbtn" href="webcal://${location.host}/api/member/shifts.ics?t=${S.member.token}">${t('allCal')}</a><p class="hint">${t('calHint')}</p>`;
    html += `<div class="between"><span><b style="font-weight:700;font-size:14px;display:block">${t('shiftAlert')}</b><small class="hint">${t('shiftAlertS')}</small></span><button class="sw sm${S.prefs.shift !== false ? ' on' : ''}" data-shiftsw role="switch"></button></div>`;
    html += `<button class="linkbtn" data-logout>${t('logout')}</button>`;
  } else if (S.tab === 'manualer') {
    let g = -1; html += `<div>` + H.manuals.map(m => { const gap = m.group !== g && g >= 0 ? '<div class="mgap"></div>' : ''; g = m.group; return gap + `<button class="mrowm" data-manual="${m.id}">${m.title}<span>›</span></button>`; }).join('') + `</div>`;
  } else {
    html += `<div>` + (H.messages.length ? H.messages.map(m => `<div class="msg"><span class="k">${t('fromBoard')}${fmt(new Date(m.t), { day:'numeric', month:'short' }).toUpperCase()}</span><p>${m.text}</p>${S.member.board ? `<small>${m.sender}, ${m.seen} av ${m.count}${t('seenBy')}</small>` : ''}</div>`).join('') : `<p class="hint">${t('noMsgs')}</p>`) + `</div>`;
    const unseen = H.messages.filter(m => !m.seenByMe).map(m => m.id); if (unseen.length) { api('/api/member/seen', { ids: unseen }); H.messages.forEach(m => m.seenByMe = true); }
  }
  b.innerHTML = html; b.scrollTop = 0;
}
// styret
const counts = () => S.home?.counts || { all: 0, upcoming: 0, active: 0 };
function renderCode(b) { const v = S.view; b.innerHTML = head(t('chooseCode'), '', true) + `<p class="hint">${v.reset ? t('resetS') : t('chooseCodeS')}</p>` + (v.reset ? `<div class="lbl2">${t('tempCode')}</div><div class="codein"><input id="tempCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><div class="lbl2">${t('newCode')}</div>` : '') + `<div class="codein"><input id="newCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><button class="pbtn" id="saveCode">${t('saveCode')}</button><p class="hint err" id="codeErr" hidden></p>`;
  $('#saveCode').onclick = async () => { const code = $('#newCode').value.trim(), temp = $('#tempCode')?.value.trim(); if (!/^\d{4}$/.test(code)) { $('#codeErr').textContent = t('errPhone').replace(/telefonnummer|phone number/, 'kode'); $('#codeErr').hidden = false; return; } const r = await api('/api/board/code', { code, temp }); if (r.ok) { S.member.hasCode = true; ls('member', S.member); S.view = { type:'send' }; renderSheet(); toast('OK'); } else { $('#codeErr').textContent = r.data.error === 'need_temp' ? t('wrongCode') : t('errNet'); $('#codeErr').hidden = false; } }; }
function renderSend(b) {
  if (!S.member.hasCode) { S.view = { type:'code' }; return renderCode(b); }
  const v = S.view; v.to = v.to || 'all'; const c = counts();
  b.innerHTML = head(t('sendT').toUpperCase(), '', true) + `<div class="lbl2">${t('to')}</div><div class="chips">${[['all', t('toAll'), c.all], ['upcoming', t('toUp'), c.upcoming], ['active', t('toAct'), c.active]].map(([k, l, n]) => `<button data-to="${k}" class="${v.to === k ? 'on' : ''}">${l} (${n})</button>`).join('')}</div>`
    + `<div class="lbl2">${t('msg')}</div><textarea class="ta" id="msgText" maxlength="300">${v.text || ''}</textarea><div class="lbl2">${t('code')}</div><div class="codein"><input id="sendCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><button class="pbtn" id="sendBtn">${t('sendTo')}${c[v.to]}</button><p class="hint err" id="sendErr" hidden></p><button class="ghost" data-view="log">${t('seeLog')}</button><button class="ghost" data-view="stats">${t('seeStats')}</button><button class="linkbtn" id="resetBtn">${t('resetCode')}</button>`;
  b.querySelectorAll('[data-to]').forEach(x => x.onclick = () => { v.to = x.dataset.to; v.text = $('#msgText').value; renderSend(b); });
  $('#sendBtn').onclick = async () => { const text = $('#msgText').value.trim(), code = $('#sendCode').value.trim(); const err = $('#sendErr'); err.hidden = true; if (!text || !/^\d{4}$/.test(code)) { err.textContent = !text ? t('msg') + '?' : t('wrongCode'); err.hidden = false; return; } $('#sendBtn').disabled = true; $('#sendBtn').textContent = t('sending'); const r = await api('/api/board/send', { text, to: v.to, code }); if (r.ok) { toast(t('sentTo') + r.data.count + t('pushed') + r.data.pushed); v.text = ''; S.home = null; await loadHome(); S.view = { type:'log' }; renderSheet(); } else { $('#sendBtn').disabled = false; $('#sendBtn').textContent = t('sendTo') + c[v.to]; err.textContent = r.data.error === 'wrong_code' ? t('wrongCode') : t('errNet'); err.hidden = false; } };
  $('#resetBtn').onclick = async () => { const r = await api('/api/board/reset', {}); if (r.ok) { S.view = { type:'code', reset: true }; renderSheet(); } };
}
async function renderStats(b) { // tall for styret: besøk, innlogget, varsler og Hjem-skjerm. Bare antall, ingen navn.
  const top = head(t('statsT'), t('statsS'), true); b.innerHTML = top + `<p class="hint">${t('loading')}</p>`;
  const r = await api('/api/board/stats'); if (S.view?.type !== 'stats') return;
  if (!r.ok) { b.innerHTML = top + `<p class="hint err">${t('errNet')}</p>`; return; }
  const x = r.data, box = (n, l, sub) => `<div class="stat"><b>${n}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
  b.innerHTML = top + `<div class="lbl2">${t('statsVisit')}</div><div class="stats">${box(x.visitors.day, t('statsDay'))}${box(x.visitors.week, t('stats7'))}${box(x.visitors.month, t('stats30'), x.visitors.pc + ' ' + t('statsPc'))}</div>`
    + `<div class="lbl2">${t('statsUse')}</div><div class="stats">${box(x.loggedIn.people, t('statsIn'), x.loggedIn.devices + ' ' + t('statsDevs'))}${box(x.push.phones, t('statsPush'), x.push.members + ' ' + t('statsMem') + ', ' + x.push.week + ' ' + t('statsNew'))}${box(x.home.phones, t('statsHome'), x.home.week + ' ' + t('statsNew'))}</div><p class="hint">${t('statsNote')}</p>`;
}
async function renderLog(b) { b.innerHTML = head(t('logT'), t('logS'), true) + `<p class="hint">${t('loading')}</p>`; const r = await api('/api/board/log'); if (S.view?.type !== 'log') return; const toName = { all: t('toAll'), upcoming: t('toUp'), active: t('toAct') };
  b.innerHTML = head(t('logT'), t('logS'), true) + `<div>` + ((r.data.messages || []).filter(thisMonth).map(m => `<div class="msg"><div style="display:flex;justify-content:space-between"><span class="k">${fmt(new Date(m.t), { day:'numeric', month:'short' }).toUpperCase()} ${pad(new Date(m.t).getHours())}:${pad(new Date(m.t).getMinutes())}</span><small>${m.seen} av ${m.count}${t('seenBy')}</small></div><b style="font-weight:700;font-size:13px">${m.sender} → ${toName[m.to] || m.to} (${m.count})</b><p>${m.text}</p></div>`).join('') || `<p class="hint">${t('noMsgs')}</p>`) + `</div>`; }
// klikk i arket
$('#sbody').addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-shift],[data-manual],[data-back],[data-close],[data-logout],[data-shiftsw],[data-view]'); if (!el) return;
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.view = null; renderSheet(); }
  else if (el.dataset.shift) { S.view = { type:'shift', id: el.dataset.shift }; renderSheet(); }
  else if (el.dataset.manual) { const m = S.home?.manuals.find(x => x.id === el.dataset.manual); S.view = { type:'manual', id: el.dataset.manual, title: m?.title || '' }; renderSheet(); }
  else if (el.dataset.view) { S.view = { type: el.dataset.view, from: S.view?.type }; renderSheet(); }
  else if (el.hasAttribute('data-back')) { S.view = S.view?.from ? { type: S.view.from } : S.view?.type === 'log' || S.view?.type === 'code' ? { type:'send' } : null; renderSheet(); }
  else if (el.hasAttribute('data-close')) openSheet(false);
  else if (el.hasAttribute('data-logout')) logout();
  else if (el.hasAttribute('data-shiftsw')) { S.prefs.shift = S.prefs.shift === false; savePrefs(); renderSheet(); }
});
// Feil lagret nummer: e-post → nytt nummer → lagres i Notion
$('#recLink').onclick = () => { $('#recModal').classList.add('open'); $('#recEmail').focus(); };
$('#recClose').onclick = () => { $('#recModal').classList.remove('open'); };
$('#recModal').addEventListener('click', e => { if (e.target === e.currentTarget) $('#recModal').classList.remove('open'); });
$('#recFind').onclick = async () => { recErr(''); const email = $('#recEmail').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return recErr(t('recEmailBad'));
  const b = $('#recFind'); b.disabled = true; const r = await api('/api/member/recover', { email }).catch(() => ({ ok:false, data:{} })); b.disabled = false;
  if (!r.ok) return recErr(r.data.error === 'not_found' ? t('recNotFound') : r.data.error === 'expired' ? t('errExpired') : t('errNet'));
  recToken = r.data.token; $('#recStep1').hidden = true; $('#recStep1').style.display = 'none'; $('#recCc').innerHTML = $('#cc').innerHTML; $('#recCc').value = $('#cc').value; $('#recStep2').hidden = false; $('#recStep2').style.display = 'flex'; $('#recPhone').focus(); };
$('#recSave').onclick = async () => { recErr(''); const raw = $('#recPhone').value.trim(), cc = $('#recCc').value; if (raw.replace(/\D/g, '').length < 6) return recErr(t('errPhone'));
  const pretty = raw.startsWith('+') || raw.startsWith('00') ? raw : '+' + cc + ' ' + raw.replace(/\D/g, '').replace(/^0/, '');
  const b = $('#recSave'); b.disabled = true; const r = await api('/api/member/recover/phone', { token: recToken, phone: pretty }).catch(() => ({ ok:false, data:{} })); b.disabled = false;
  if (!r.ok) return recErr(r.data.error === 'phone_taken' ? t('recTaken') : r.data.error === 'bad_phone' ? t('errPhone') : t('errNet'));
  resetRecover(); $('#loginErr').hidden = true; failedLogins = 0; sessionStorage.removeItem('failedLogins');
  setMember({ token: r.data.token, name: r.data.name, board: r.data.board, hasCode: r.data.hasCode }); await pullPrefs(); savePrefs(); await loadHome(); toast(t('hi') + first(S.member.name).toUpperCase()); };
$('#loginBtn').onclick = login; $('#phone').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logoutBtn').onclick = logout;
$('#sendLink').onclick = () => { openPanel(false); openSheet(true, { type:'send' }); };
$('#statsLink').onclick = () => { openPanel(false); openSheet(true, { type:'stats' }); };

// ---- start ----
(async () => {
  applyTheme(); const d = today(); S.ym = { y: d.getFullYear(), m: d.getMonth() };
  fetch(API + '/api/settings').then(r => r.json()).then(x => { S.join = x.join !== false; renderPanel(); }).catch(() => {});
  try { // telefonen melder seg én gang om dagen, så styret kan se hvor mange som har lagt appen på Hjem-skjerm. Tilfeldig id, ingen navn.
    let did = localStorage.getItem('dev'); if (!did) { did = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('dev', did); }
    const sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true, day = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('pinged') !== day + (sa ? 's' : 'b')) { localStorage.setItem('pinged', day + (sa ? 's' : 'b')); fetch(API + '/api/ping', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ id: did, standalone: sa, pc: matchMedia('(hover: hover) and (pointer: fine)').matches }) }).catch(() => {}); }
  } catch (e) {}
  try { const r = await fetch(API + '/api/events'); if (!r.ok) throw 0; S.events = await r.json(); } catch { S.events = location.hostname === 'localhost' ? SAMPLE : []; }
  S.sel = items()[0]?.date || null; if (S.sel) { const sd = parse(S.sel); S.ym = { y: sd.getFullYear(), m: sd.getMonth() }; }
  renderAll(); route(); renderPill(); if (S.member) { loadHome(); pullPrefs(); } else loadCountries();
  if ('serviceWorker' in navigator) { sw().then(async reg => { const s = await reg.pushManager.getSubscription(); if (S.prefs.on && !s) { S.prefs.on = false; ls('prefs', S.prefs); renderPanel(); } }); }
})();
</script>
