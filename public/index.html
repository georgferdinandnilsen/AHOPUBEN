<script>
// Tema settes før første tegning, ellers farger Safari topplinjen hvit og beholder den.
function sunTimes(date, lat = 59.91, lng = 10.75) { // SunCalc-formelen, kun opp/ned
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009, e = rad * 23.4397;
  const d = date.valueOf() / 864e5 - 0.5 + J1970 - J2000, lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds), L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const fromJ = j => new Date((j + 0.5 - J1970) * 864e5);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}
function applyTheme() {
  var th = null; try { th = JSON.parse(localStorage.getItem('theme')); } catch (e) {}
  th = th || 'dark';
  if (th === 'auto') { var now = new Date(), s = sunTimes(now); th = now < s.rise || now > s.set ? 'dark' : 'light'; }
  document.documentElement.dataset.theme = th;
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = th === 'dark' ? '#000000' : '#ffffff';
}
applyTheme();

];
const $ = s => document.querySelector(s);
const ls = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
const S = { lang: ls('lang') || (navigator.language.startsWith('nb') || navigator.language.startsWith('no') ? 'no' : 'en'), theme: ls('theme') || 'dark', prefs: (p => ({ ...p, offsets: norm(p.offsets) }))(ls('prefs') || { on:false, plain:true }), events: [], ym: null, sel: null, vapid: null, member: ls('member') || null, home: null, tab: 'vakter', view: null };
const t = k => T[S.lang][k];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmt = (d, o) => new Intl.DateTimeFormat(t('locale'), o).format(typeof d === 'string' ? parse(d) : d);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const title = e => (S.lang === 'en' && e.titleEn) || e.title;
const desc = e => (S.lang === 'en' && e.descEn) || e.desc || '';
const typ = e => (S.lang === 'en' && e.typeEn) || e.type || '';

// Arrangementer + torsdager uten program = det folk blar i
function items(weeks = 16) {
  const byDate = Object.fromEntries(S.events.map(e => [e.date, e]));
  const out = S.events.filter(e => parse(e.date) >= today()).map(e => ({ plain:false, ...e }));
  const d = today(); const end = new Date(d); end.setDate(end.getDate() + weeks * 7);
  for (; d <= end; d.setDate(d.getDate() + 1)) if (d.getDay() === 4 && !byDate[iso(d)]) out.push({ id:'p'+iso(d), date: iso(d), plain:true });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const label = e => e.plain ? t('plain') : title(e);
const sub = e => e.plain ? `${t('noProgram')}, ${t('open')}` : `${typ(e)}${e.pub ? `, ${t('pub')} #${e.pub}` : ''}`;

function renderHero() {
  const all = items(); const e = all[0]; const h = $('#hero');
  if (!e) { h.className = 'hero noimg'; h.innerHTML = `<div class="genwrap"><img class="gen" src="/icon-512.png" alt=""></div><div class="tx"><h1>AHO PUB</h1></div>`; return; }
  const d = parse(e.date); const diff = (d - today()) / 864e5;
  const chip = diff === 0 ? t('tonight') : (d.getDay() === 4 && diff < 7 ? t('thisThu') : t('next'));
  const n = e.plain ? all.find(x => !x.plain) : null;
  const teaser = n ? `<button class="teaser" data-d="${n.date}">${t('nextEvent')}: ${title(n)}, ${fmt(n.date, { day:'numeric', month:'short' })} →</button>` : '';
  h.className = 'hero' + (e.image ? '' : ' noimg');
  h.innerHTML = `${e.image ? `<img src="${e.image}" alt="">` : '<div class="genwrap"><img class="gen" src="/icon-512.png" alt=""></div>'}<div class="tx"><span class="chip">${chip}</span><h1>${label(e)}</h1><div class="meta">${fmt(d, { weekday:'long', day:'numeric', month:'long' })}, ${t('open')}</div>${desc(e) ? `<p class="info">${desc(e)}</p>` : ''}${teaser}</div>`;
  $('#desc').textContent = ''; $('#desc').hidden = true; // infoen står i hero-feltet
  $('#actions').innerHTML = e.plain ? '' : `<a class="btn primary" href="${API}/api/ics/${e.id}">${t('addCal')}</a>${navigator.share ? `<button class="btn ghost" id="share">${t('share')}</button>` : ''}`;
  $('#share')?.addEventListener('click', () => navigator.share({ title: label(e), text: `${label(e)}, ${fmt(d, { weekday:'long', day:'numeric', month:'long' })} ${t('open')}`, url: location.origin }).catch(() => {}));
}

function renderCal() {
  const { y, m } = S.ym; const first = new Date(y, m, 1); const start = (first.getDay() + 6) % 7; const days = new Date(y, m+1, 0).getDate();
  const evDates = new Set(S.events.map(e => e.date)); const tod = iso(today());
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - start + i); const k = iso(d); const out = d.getMonth() !== m; const thu = d.getDay() === 4; const past = k < tod;
    const cls = ['day', out && 'outside', thu && 'thu', past && 'past', (evDates.has(k) || (thu && !out)) && !out && 'ev', k === tod && 'today', k === S.sel && 'sel'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-d="${k}">${d.getDate()}</button>`;
    if (i >= 34 && (i + 1) % 7 === 0 && new Date(y, m, 1 - start + i + 1).getMonth() !== m) break;
  }
  const e = S.events.find(x => x.date === S.sel); const sd = S.sel ? parse(S.sel) : null;
  const card = !S.sel ? '' : e ? `<div class="selcard">${e.image ? `<img src="${e.image}" alt="">` : '<div class="ph"></div>'}<div><div class="d">${fmt(sd, { weekday:'short', day:'numeric', month:'short' })}, ${t('open')}</div><h3>${label(e)}</h3><p>${sub(e)}</p></div></div>`
    : sd.getDay() === 4 && S.sel >= tod ? `<div class="selcard"><div class="ph"></div><div><div class="d">${fmt(sd, { weekday:'short', day:'numeric', month:'short' })}, ${t('open')}</div><h3>${t('plain')}</h3><p>${t('noProgram')}</p></div></div>`
    : `<div class="selcard empty">${t('closed')}</div>`;
  $('#cal').innerHTML = `<div class="cal-head"><h2>${fmt(first, { month:'long', year:'numeric' })}</h2><div class="cal-nav"><button data-nav="-1" aria-label="Forrige">←</button><button data-nav="1" aria-label="Neste" style="color:var(--fg)">→</button></div></div><div class="grid">${t('wd').map((w, i) => `<div class="wd${i === 3 ? ' thu' : ''}">${w}</div>`).join('')}${cells}</div>${card}`;
}

function renderList() {
  const all = items().slice(1, 6);
  $('#list').innerHTML = `<h2>${t('upcoming')}</h2>` + all.map(e => `<div class="item"><button class="sel" data-d="${e.date}"><span class="d">${fmt(e.date, { day:'numeric', month:'short' })}</span><span class="t"><b>${label(e)}</b><span>${sub(e)}</span></span></button><a class="plus" href="${API}/api/ics/${e.id}" aria-label="${t('addCal')}">+</a></div>`).join('');
  $('#cta').innerHTML = `<b>${t('idea')}</b><span>${t('ideaSub')}</span>`;

function renderPanel() {
  const ids = { join:'join', pMember:'member', pMemberHint:'memberHint', loginBtn:'login', logoutBtn:'logout', sendLinkT:'sendT', sendLinkS:'sendS', pillT:'myShifts', pTitle:'notif', pOn:'notifOn', pOnSub:'notifSub', pHow:'how', pPlain:'alsoPlain', test:'test', pLook:'look', pDayHint:'dayHint', pNoTest:'noTest', pNoTestBody:'noTestBody', pAuto:'auto2', pCredit:'credit', sTitle:'sTitle', sHead:'sHead', sSub:'sSub', fIdea:'fIdea', fMore:'fMore', fName:'fName', send:'send', sNote:'sNote' };
  for (const [id, k] of Object.entries(ids)) $('#' + id).textContent = t(k);
  $('#idea').placeholder = t('fIdeaPh'); $('#more').placeholder = t('fMorePh'); $('#name').placeholder = t('fNamePh');
  $('#swOn').classList.toggle('on', S.prefs.on); $('#swPlain').classList.toggle('on', S.prefs.plain);
  $('#chips').innerHTML = KEYS.map((k, i) => `<button data-k="${k}" class="${S.prefs.offsets.includes(k) ? 'on' : ''}">${t('chips')[i]}</button>`).join('');
  for (const b of document.querySelectorAll('[data-th]')) { b.textContent = t(b.dataset.th); b.classList.toggle('on', S.theme === b.dataset.th); }
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === S.lang);

const b64 = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function sw() { return navigator.serviceWorker.register('/sw.js'); }

  else if (el.dataset.manual) { const m = S.home?.manuals.find(x => x.id === el.dataset.manual); S.view = { type:'manual', id: el.dataset.manual, title: m?.title || '' }; renderSheet(); }
  else if (el.dataset.view) { S.view = { type: el.dataset.view }; renderSheet(); }
  else if (el.hasAttribute('data-back')) { S.view = S.view?.type === 'log' || S.view?.type === 'code' ? { type:'send' } : null; renderSheet(); }
  else if (el.hasAttribute('data-close')) openSheet(false);
  else if (el.hasAttribute('data-logout')) logout();
  else if (el.hasAttribute('data-shiftsw')) { S.prefs.shift = S.prefs.shift === false; savePrefs(); renderSheet(); }
});
$('#loginBtn').onclick = login; $('#phone').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logoutBtn').onclick = logout;
$('#sendLink').onclick = () => { openPanel(false); openSheet(true, { type:'send' }); };

// ---- start ----
(async () => {
  applyTheme(); const d = today(); S.ym = { y: d.getFullYear(), m: d.getMonth() };
  try { const r = await fetch(API + '/api/events'); if (!r.ok) throw 0; S.events = await r.json(); } catch { S.events = location.hostname === 'localhost' ? SAMPLE : []; }
  S.sel = items()[0]?.date || null; if (S.sel) { const sd = parse(S.sel); S.ym = { y: sd.getFullYear(), m: sd.getMonth() }; }
  renderAll(); route(); renderPill(); if (S.member) loadHome(); else loadCountries();
  if ('serviceWorker' in navigator) { sw().then(async reg => { const s = await reg.pushManager.getSubscription(); if (S.prefs.on && !s) { S.prefs.on = false; ls('prefs', S.prefs); renderPanel(); } }); }
})();
</script>
</body>
