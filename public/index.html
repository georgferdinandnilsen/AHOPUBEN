<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHO Pub Arrangementer</title>
<meta name="description" content="Hva skjer på AHO Puben. Neste arrangement, kalender og varsler.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AHO Pub">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--muted:#6b6b6b;--line:#e6e6e6;--chip:#cfcfcf;--blue:#0000ff;--blue-soft:#0000ff;--btn-bg:#000;--btn-fg:#fff;--credit:#c4c4c4;--panel:#fff;--scrim:rgba(0,0,0,.3);--grad:255,255,255;--chrome:rgba(255,255,255,.55);--past:#b0b0b0;--outside:#d0d0d0;--field:#cfcfcf;--ph:#8a8a8a}
[data-theme=dark]{--bg:#000;--fg:#fff;--muted:#8a8a8a;--line:#2a2a2a;--chip:#555;--blue-soft:#6b6bff;--btn-bg:#fff;--btn-fg:#000;--credit:#3a3a3a;--panel:#0d0d0d;--scrim:rgba(0,0,0,.6);--grad:0,0,0;--chrome:rgba(0,0,0,.35);--past:#555;--outside:#333;--field:#555;--ph:#7a7a7a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "Space Grotesk",system-ui,sans-serif;transition:background .3s,color .3s;overscroll-behavior-y:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
h1,h2,h3,.ab{font-family:"Archivo Black",sans-serif;font-weight:400}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
/* chrome */
.chrome{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:5;background:var(--chrome);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);padding:calc(env(safe-area-inset-top) + 8px) 20px 12px;display:flex;justify-content:space-between;align-items:center;transition:background .3s}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:0}
[data-theme=dark] .brand img{filter:invert(1)}
.brand span{font-family:"Archivo Black";font-size:13px;letter-spacing:.02em}
.tools{display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--chip);border-radius:999px}
.lang button{padding:5px 10px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.04em}
.lang button.on{background:var(--fg);color:var(--bg)}
.bell{width:26px;height:26px;position:relative}
.bell svg{width:26px;height:26px;fill:var(--fg)}
.bell.on::after{content:"";position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--blue)}
/* hero */
.hero{position:relative;height:72vh;min-height:520px;max-height:640px;overflow:hidden;background:var(--blue)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(var(--grad),.05) 0%,rgba(var(--grad),.12) 50%,rgba(var(--grad),.97) 100%)}
.hero.noimg::after{display:none}
.hero .tx{position:absolute;left:20px;right:20px;bottom:28px;z-index:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero.noimg .tx{color:#fff}
.chip{display:inline-block;padding:6px 10px;background:var(--blue);color:#fff;font-weight:700;font-size:11px;letter-spacing:.1em}
.hero.noimg .chip{background:#000}
.hero h1{font-size:clamp(40px,12vw,50px);line-height:.88;letter-spacing:-.02em;text-transform:uppercase}
.hero .meta{font-weight:500;font-size:14px;letter-spacing:.04em;opacity:.8;text-transform:uppercase}
.teaser{margin-top:6px;padding:9px 12px;border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left}
/* content */
.content{padding:24px 20px;display:flex;flex-direction:column;gap:28px}
.desc{color:var(--fg);opacity:.85}
.row{display:flex;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;padding:14px 18px;font-weight:700;font-size:13px;letter-spacing:.06em;text-decoration:none;color:inherit}
.btn.primary{flex:1;background:var(--btn-bg);color:var(--btn-fg)}
.btn.ghost{border:1px solid var(--chip)}
/* calendar */
.cal{display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head h2{font-size:22px;text-transform:uppercase}
.cal-nav{display:flex;gap:18px;font-weight:700;font-size:18px}
.cal-nav button{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--muted)}
.wd.thu{color:var(--blue-soft)}
.day{height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--fg);border:1.5px solid transparent}
.day.outside{color:var(--outside)}
.day.past{color:var(--past)}
.day.thu{font-weight:700}
.day.ev{border-color:var(--blue)}
.day.ev.past{border-color:transparent;color:var(--blue-soft);opacity:.6}
.day.today{border-color:var(--fg)}
.day.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.selcard{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--blue)}
.selcard img,.selcard .ph{width:56px;height:56px;object-fit:cover;background:var(--blue);flex:none}
.selcard .d{font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--blue-soft);text-transform:uppercase}
.selcard h3{font-size:18px;text-transform:uppercase}
.selcard p{font-size:13px;color:var(--muted)}
.selcard.empty{border-color:var(--line);color:var(--muted);font-size:14px}
/* list */
.list h2{font-size:16px;text-transform:uppercase}
.item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item .d{width:62px;flex:none;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--blue-soft);text-transform:uppercase}
.item .t{flex:1}
.item .t b{display:block;font-family:"Archivo Black";font-weight:400;font-size:15px;text-transform:uppercase}
.item .t span{font-size:12px;color:var(--muted)}
.item .a{color:var(--muted);font-weight:700}
.cta{display:block;width:100%;text-align:left;background:var(--blue);color:#fff;padding:20px}
.cta b{display:block;font-family:"Archivo Black";font-weight:400;font-size:20px}
.cta span{font-weight:500;font-size:14px;opacity:.85}
/* panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:var(--panel);border-left:2px solid var(--blue);z-index:11;transform:translateX(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 52px) 22px 24px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.panel.open{transform:none}
.panel.drag{transition:none}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:24px;text-transform:uppercase}
.ph button{font-size:26px;color:var(--muted);line-height:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.between b{display:block;font-weight:700;font-size:16px}
.between small{display:block;font-size:12px;color:var(--muted)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(20px)}
.sw.sm{width:41px;height:25px}.sw.sm::after{width:21px;height:21px}.sw.sm.on::after{transform:translateX(16px)}
.hr{height:1px;background:var(--line)}
.lbl{font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border:1.5px solid var(--chip);font-weight:500;font-size:13px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips.half button{flex:1}
.opt{font-weight:500;font-size:14px}
.next{border:1.5px solid var(--blue);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.next .k{font-weight:500;font-size:10px;letter-spacing:.08em;color:var(--blue-soft)}
.next b{font-family:"Archivo Black";font-weight:400;font-size:15px}
.next span{font-size:12px;color:var(--muted)}
.test{border:1px solid var(--chip);padding:11px;font-weight:700;font-size:12px;letter-spacing:.06em;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.info{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.info b{font-weight:700;font-size:13px}
.info p{font-size:12px;color:var(--muted)}
.credit{font-weight:300;font-size:11px;letter-spacing:.02em;color:var(--credit);margin-top:auto}
/* forslag */
.view{display:none}
.view.on{display:block}
.top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 8px) 20px 8px}
.top button{font-weight:700;font-size:20px}
.top h2{font-size:16px;text-transform:uppercase}
.form{padding:16px 20px 20px;display:flex;flex-direction:column;gap:20px}
.form h1{font-size:34px;line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
.form p{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:13px}
.field input,.field textarea{font:inherit;color:inherit;background:none;border:1px solid var(--field);padding:15px 14px;border-radius:0;width:100%}
.field textarea{min-height:120px;resize:vertical}
.field ::placeholder{color:var(--ph)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.send{background:var(--blue);color:#fff;padding:18px;font-family:"Archivo Black";font-size:14px;letter-spacing:.04em;width:100%}
.send[disabled]{opacity:.5}
.note{font-size:12px;color:var(--muted)}
.ok{border:1.5px solid var(--blue);padding:20px;font-family:"Archivo Black";font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div id="home" class="view on">
    <header class="chrome">
      <div class="brand"><img src="/icon-192.png" alt="AHO Pub"><span>ARRANGEMENTER</span></div>
      <div class="tools">
        <div class="lang"><button data-lang="no">NO</button><button data-lang="en">EN</button></div>
        <button class="bell" id="bell" aria-label="Varsler"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v4.5L4 16v1h16v-1l-2-3.5V8a6 6 0 0 0-6-6zm0 20a2.5 2.5 0 0 0 2.5-2h-5A2.5 2.5 0 0 0 12 22z"/></svg></button>
      </div>
    </header>
    <section class="hero" id="hero"></section>
    <div class="content">
      <p class="desc" id="desc"></p>
      <div class="row" id="actions"></div>
      <section class="cal" id="cal"></section>
      <section class="list" id="list"></section>
      <button class="cta" id="cta"></button>
    </div>
  </div>

  <div id="forslag" class="view">
    <div class="top"><button id="back" aria-label="Tilbake">←</button><h2 id="sTitle"></h2></div>
    <form class="form" id="form">
      <h1 id="sHead"></h1>
      <p id="sSub"></p>
      <div class="field"><label for="idea" id="fIdea"></label><input id="idea" name="idea" required maxlength="120"></div>
      <div class="field"><label for="more" id="fMore"></label><textarea id="more" name="more" maxlength="1000"></textarea></div>
      <div class="field"><label for="name" id="fName"></label><input id="name" name="name" maxlength="80"></div>
      <button class="send" id="send" type="submit"></button>
      <p class="note" id="sNote"></p>
    </form>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Varsler og utseende">
    <div class="ph"><h2 id="pTitle"></h2><button id="close" aria-label="Lukk">×</button></div>
    <div class="between"><div><b id="pOn"></b><small id="pOnSub"></small></div><button class="sw" id="swOn" role="switch"></button></div>
    <div class="hr"></div>
    <div class="lbl" id="pHow"></div>
    <div class="chips" id="chips"></div>
    <div class="between"><span class="opt" id="pPlain"></span><button class="sw sm" id="swPlain" role="switch"></button></div>
    <div class="next"><span class="k" id="pNextK"></span><b id="pNext1"></b><span id="pNext2"></span></div>
    <button class="test" id="test"></button>
    <div class="hr"></div>
    <div class="lbl" id="pLook"></div>
    <div class="chips half" id="themeRow"><button data-th="light"></button><button data-th="dark"></button></div>
    <div class="chips" id="themeRow2"><button data-th="auto" style="flex:1"></button></div>
    <p class="hint" id="pDayHint"></p>
    <div class="hr"></div>
    <div class="info"><b id="pNoTest"></b><p id="pNoTestBody"></p></div>
    <p class="hint" id="pAuto"></p>
    <p class="credit" id="pCredit"></p>
  </aside>
</div>

<script>
const API = location.port === '8000' ? 'http://localhost:8787' : ''; // ponytail: python-server-forhåndsvisning peker på wrangler dev; i prod er alt samme opprinnelse
const CHIPS = [[0,16],[1,12],[2,12],[7,12]];
const T = {
  no:{nextEvent:'NESTE ARRANGEMENT',tonight:'I KVELD',thisThu:'DENNE TORSDAGEN',next:'NESTE',upcoming:'KOMMENDE',plain:'Rolig pub',noProgram:'Ingen program',open:'kl 19-01',closed:'Ingen arrangement denne dagen',addCal:'LEGG I KALENDER',share:'DEL',idea:'HAR DU EN IDÉ?',ideaSub:'Send forslag til styret →',
    notif:'VARSLER',notifOn:'Varsler på',notifSub:'Du får beskjed før hvert arrangement',how:'Hvor tidlig vil du ha beskjed?',chips:['Samme dag kl 16','Dagen før kl 12','To dager før kl 12','En uke før'],alsoPlain:'Også når det bare er vanlig pub',nextK:'NESTE VARSEL',none:'Ingen planlagt',nextOff:'Slå på varsler for å få beskjed',test:'SEND TESTVARSEL NÅ',testSent:'SENDT. KOM DET?',testFail:'VIRKET IKKE. SE UNDER.',
    look:'Utseende',light:'Lys',dark:'Mørk',auto:'Dag og natt',dayHint:'Dag og natt: solnedgangen i Oslo bytter tema for deg.',noTest:'Kom ikke testvarselet?',noTestBody:'Appen må ligge på Hjem-skjerm: trykk Del, så «Legg til på Hjem-skjerm». Prøv testvarselet etterpå.',auto2:'Lagres automatisk',credit:'Laget av Georg Ferdinand Nilsen',
    sTitle:'FORSLAG',sHead:'HVA VIL DU HA PÅ PUBEN?',sSub:'Styret leser alt. Navn er valgfritt.',fIdea:'Idé',fIdeaPh:'F.eks. karaoke, vinsmaking, DJ-battle',fMore:'Fortell mer',fMorePh:'Hva, hvorfor, hvem bør komme?',fName:'Navn (valgfritt)',fNamePh:'Så styret kan takke deg',send:'SEND FORSLAG',sending:'SENDER…',sNote:'Lander rett i styrets Notion. Du ser det ikke etterpå, men det gjør styret.',sent:'Sendt. Takk!',sErr:'Noe gikk galt. Prøv igjen.',
    wd:['MA','TI','ON','TO','FR','LØ','SØ'],pub:'pub',and:'og',locale:'nb-NO'},
  en:{nextEvent:'NEXT EVENT',tonight:'TONIGHT',thisThu:'THIS THURSDAY',next:'NEXT',upcoming:'UPCOMING',plain:'Quiet pub',noProgram:'No programme',open:'7pm-1am',closed:'No event this day',addCal:'ADD TO CALENDAR',share:'SHARE',idea:'GOT AN IDEA?',ideaSub:'Send a suggestion to the board →',
    notif:'ALERTS',notifOn:'Alerts on',notifSub:'You get a heads-up before every event',how:'How early do you want to know?',chips:['Same day 4pm','Day before 12pm','Two days before 12pm','A week before'],alsoPlain:'Also on plain pub nights',nextK:'NEXT ALERT',none:'None planned',nextOff:'Turn on alerts to get notified',test:'SEND TEST ALERT NOW',testSent:'SENT. DID IT ARRIVE?',testFail:'DID NOT WORK. SEE BELOW.',
    look:'Appearance',light:'Light',dark:'Dark',auto:'Day & night',dayHint:'Day & night: sunset in Oslo switches the theme for you.',noTest:'No test alert?',noTestBody:'The app must be on your Home Screen: tap Share, then "Add to Home Screen". Then try the test alert again.',auto2:'Saved automatically',credit:'Made by Georg Ferdinand Nilsen',
    sTitle:'SUGGEST',sHead:'WHAT DO YOU WANT AT THE PUB?',sSub:'The board reads everything. Name is optional.',fIdea:'Idea',fIdeaPh:'E.g. karaoke, wine tasting, DJ battle',fMore:'Tell us more',fMorePh:'What, why, who should come?',fName:'Name (optional)',fNamePh:'So the board can thank you',send:'SEND SUGGESTION',sending:'SENDING…',sNote:'Goes straight into the board\'s Notion. You won\'t see it afterwards, but the board will.',sent:'Sent. Thanks!',sErr:'Something went wrong. Try again.',
    wd:['MO','TU','WE','TH','FR','SA','SU'],pub:'pub',and:'and',locale:'en-GB'}
};
const SAMPLE = [
  {id:'s1',date:'2026-10-29',title:'Halloween',titleEn:'Halloween',type:'Aktivitet',typeEn:'Activity',desc:'Kostymekonkurranse, DJ og skummel drinkmeny. Beste kostyme vinner bar-tab. Dørene åpner 19, kåringen er kl 23.',descEn:'Costume contest, DJ and a spooky drinks menu. Best costume wins a bar tab. Doors at 7pm, judging at 11pm.',image:'/sample-halloween.jpg',pub:11},
  {id:'s2',date:'2026-11-05',title:'DJ: Dave Van Zon',titleEn:'DJ: Dave Van Zon',type:'DJ',typeEn:'DJ',desc:'DJ-kveld. Fri inngang, dørene åpner 19.',descEn:'DJ night. Free entry, doors at 7pm.',image:'',pub:12},
  {id:'s3',date:'2026-11-26',title:'Julepub',titleEn:'Christmas pub',type:'Aktivitet',typeEn:'Activity',desc:'Gløgg, pepperkaker og julemusikk. Siste pub før jul.',descEn:'Mulled wine, gingerbread and Christmas music. Last pub before the holidays.',image:'',pub:15}
];
const $ = s => document.querySelector(s);
const ls = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
const S = { lang: ls('lang') || (navigator.language.startsWith('nb') || navigator.language.startsWith('no') ? 'no' : 'en'), theme: ls('theme') || 'dark', prefs: ls('prefs') || { on:false, offsets:[[0,16],[1,12]], plain:true }, events: [], ym: null, sel: null, vapid: null };
const t = k => T[S.lang][k];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmt = (d, o) => new Intl.DateTimeFormat(t('locale'), o).format(typeof d === 'string' ? parse(d) : d);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const title = e => (S.lang === 'en' && e.titleEn) || e.title;
const desc = e => (S.lang === 'en' && e.descEn) || e.desc || '';
const typ = e => (S.lang === 'en' && e.typeEn) || e.type || '';

// Arrangementer + torsdager uten program = det folk blar i
function items(weeks = 16) {
  const byDate = Object.fromEntries(S.events.map(e => [e.date, e]));
  const out = S.events.filter(e => parse(e.date) >= today()).map(e => ({ ...e, plain:false }));
  const d = today(); const end = new Date(d); end.setDate(end.getDate() + weeks * 7);
  for (; d <= end; d.setDate(d.getDate() + 1)) if (d.getDay() === 4 && !byDate[iso(d)]) out.push({ id:'p'+iso(d), date: iso(d), plain:true });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const label = e => e.plain ? t('plain') : title(e);
const sub = e => e.plain ? `${t('noProgram')}, ${t('open')}` : `${typ(e)}${e.pub ? `, ${t('pub')} #${e.pub}` : ''}`;

function renderHero() {
  const all = items(); const e = all[0]; const h = $('#hero');
  if (!e) { h.className = 'hero noimg'; h.innerHTML = `<div class="tx"><h1>AHO PUB</h1></div>`; return; }
  const d = parse(e.date); const diff = (d - today()) / 864e5;
  const chip = diff === 0 ? t('tonight') : (d.getDay() === 4 && diff < 7 ? t('thisThu') : t('next'));
  const n = e.plain ? all.find(x => !x.plain) : null;
  const teaser = n ? `<button class="teaser" data-d="${n.date}">${t('nextEvent')}: ${title(n)}, ${fmt(n.date, { day:'numeric', month:'short' })} →</button>` : '';
  h.className = 'hero' + (e.image ? '' : ' noimg');
  h.innerHTML = `${e.image ? `<img src="${e.image}" alt="">` : ''}<div class="tx"><span class="chip">${chip}</span><h1>${label(e)}</h1><div class="meta">${fmt(d, { weekday:'long', day:'numeric', month:'long' })}, ${t('open')}</div>${teaser}</div>`;
  $('#desc').textContent = e.plain ? '' : desc(e);
  $('#actions').innerHTML = e.plain ? '' : `<a class="btn primary" href="${API}/api/ics/${e.id}">${t('addCal')}</a>${navigator.share ? `<button class="btn ghost" id="share">${t('share')}</button>` : ''}`;
  $('#share')?.addEventListener('click', () => navigator.share({ title: label(e), text: `${label(e)}, ${fmt(d, { weekday:'long', day:'numeric', month:'long' })} ${t('open')}`, url: location.origin }).catch(() => {}));
}

function renderCal() {
  const { y, m } = S.ym; const first = new Date(y, m, 1); const start = (first.getDay() + 6) % 7; const days = new Date(y, m+1, 0).getDate();
  const evDates = new Set(S.events.map(e => e.date)); const tod = iso(today());
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - start + i); const k = iso(d); const out = d.getMonth() !== m; const thu = d.getDay() === 4; const past = k < tod;
    const cls = ['day', out && 'outside', thu && 'thu', past && 'past', (evDates.has(k) || (thu && !out)) && !out && 'ev', k === tod && 'today', k === S.sel && 'sel'].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-d="${k}">${d.getDate()}</button>`;
    if (i >= 34 && (i + 1) % 7 === 0 && new Date(y, m, 1 - start + i + 1).getMonth() !== m) break;
  }
  const e = S.events.find(x => x.date === S.sel); const sd = S.sel ? parse(S.sel) : null;
  const card = !S.sel ? '' : e ? `<div class="selcard">${e.image ? `<img src="${e.image}" alt="">` : '<div class="ph"></div>'}<div><div class="d">${fmt(sd, { weekday:'short', day:'numeric', month:'short' })}, ${t('open')}</div><h3>${title(e)}</h3><p>${sub(e)}</p></div></div>`
    : sd.getDay() === 4 && S.sel >= tod ? `<div class="selcard"><div class="ph"></div><div><div class="d">${fmt(sd, { weekday:'short', day:'numeric', month:'short' })}, ${t('open')}</div><h3>${t('plain')}</h3><p>${t('noProgram')}</p></div></div>`
    : `<div class="selcard empty">${t('closed')}</div>`;
  $('#cal').innerHTML = `<div class="cal-head"><h2>${fmt(first, { month:'long', year:'numeric' })}</h2><div class="cal-nav"><button data-nav="-1" aria-label="Forrige">←</button><button data-nav="1" aria-label="Neste" style="color:var(--fg)">→</button></div></div><div class="grid">${t('wd').map((w, i) => `<div class="wd${i === 3 ? ' thu' : ''}">${w}</div>`).join('')}${cells}</div>${card}`;
}

function renderList() {
  const all = items().slice(1, 6);
  $('#list').innerHTML = `<h2>${t('upcoming')}</h2>` + all.map(e => `<button class="item" data-d="${e.date}"><span class="d">${fmt(e.date, { day:'numeric', month:'short' })}</span><span class="t"><b>${label(e)}</b><span>${sub(e)}</span></span><span class="a">→</span></button>`).join('');
  $('#cta').innerHTML = `<b>${t('idea')}</b><span>${t('ideaSub')}</span>`;
}

function nextNotification() {
  if (!S.prefs.on) return [t('nextOff'), ''];
  const now = new Date(); let best = null;
  for (const e of items(60)) { if (e.plain && !S.prefs.plain) continue;
    for (const [days, hour] of S.prefs.offsets) { const d = parse(e.date); d.setDate(d.getDate() - days); d.setHours(hour, 0, 0, 0); if (d > now && (!best || d < best.d)) best = { d, e }; } }
  if (!best) return [t('none'), ''];
  return [cap(fmt(best.d, { weekday:'long', day:'numeric', month:'short' })) + ` kl ${pad(best.d.getHours())}`, `${label(best.e)}, ${fmt(best.e.date, { weekday:'long', day:'numeric', month:'short' })}`];
}

function renderPanel() {
  const ids = { pTitle:'notif', pOn:'notifOn', pOnSub:'notifSub', pHow:'how', pPlain:'alsoPlain', pNextK:'nextK', test:'test', pLook:'look', pDayHint:'dayHint', pNoTest:'noTest', pNoTestBody:'noTestBody', pAuto:'auto2', pCredit:'credit', sTitle:'sTitle', sHead:'sHead', sSub:'sSub', fIdea:'fIdea', fMore:'fMore', fName:'fName', send:'send', sNote:'sNote' };
  for (const [id, k] of Object.entries(ids)) $('#' + id).textContent = t(k);
  $('#idea').placeholder = t('fIdeaPh'); $('#more').placeholder = t('fMorePh'); $('#name').placeholder = t('fNamePh');
  $('#swOn').classList.toggle('on', S.prefs.on); $('#swPlain').classList.toggle('on', S.prefs.plain);
  $('#chips').innerHTML = CHIPS.map((c, i) => `<button data-i="${i}" class="${S.prefs.offsets.some(o => o[0] === c[0]) ? 'on' : ''}">${t('chips')[i]}</button>`).join('');
  for (const b of document.querySelectorAll('[data-th]')) { b.textContent = t(b.dataset.th); b.classList.toggle('on', S.theme === b.dataset.th); }
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === S.lang);
  $('#bell').classList.toggle('on', S.prefs.on);
  const [a, b] = nextNotification(); $('#pNext1').textContent = a; $('#pNext2').textContent = b;
}

function renderAll() { document.documentElement.lang = S.lang === 'no' ? 'nb' : 'en'; renderHero(); renderCal(); renderList(); renderPanel(); }

// ---- tema ----
function sunTimes(date, lat = 59.91, lng = 10.75) { // SunCalc-formelen, kun opp/ned
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009, e = rad * 23.4397;
  const d = date.valueOf() / 864e5 - 0.5 + J1970 - J2000, lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds), L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const fromJ = j => new Date((j + 0.5 - J1970) * 864e5);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}
function applyTheme() {
  let th = S.theme;
  if (th === 'auto') { const now = new Date(), s = sunTimes(now); th = now < s.rise || now > s.set ? 'dark' : 'light'; }
  document.documentElement.dataset.theme = th;
  document.querySelector('meta[name=theme-color]').content = th === 'dark' ? '#000000' : '#ffffff';
}
setInterval(applyTheme, 60e3);

// ---- push ----
const b64 = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function sw() { return navigator.serviceWorker.register('/sw.js'); }
async function savePrefs() { ls('prefs', S.prefs); renderPanel(); if (!S.prefs.on) return;
  const reg = await sw(); const s = await reg.pushManager.getSubscription(); if (!s) return;
  await fetch(API + '/api/subscribe', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ subscription: s.toJSON(), prefs: { offsets: S.prefs.offsets, plain: S.prefs.plain, lang: S.lang } }) }).catch(() => {}); }
async function toggleOn() {
  if (S.prefs.on) { S.prefs.on = false; const reg = await sw(); const s = await reg.pushManager.getSubscription();
    if (s) { fetch(API + '/api/subscribe', { method:'DELETE', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ endpoint: s.endpoint }) }).catch(() => {}); await s.unsubscribe(); }
    return savePrefs(); }
  try {
    if (!('PushManager' in window)) throw new Error('nopush');
    if (!S.vapid) S.vapid = (await (await fetch(API + '/api/vapid')).json()).key;
    const reg = await sw(); if ((await Notification.requestPermission()) !== 'granted') throw new Error('denied');
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(S.vapid) });
    S.prefs.on = true; await savePrefs();
  } catch (e) { S.prefs.on = false; renderPanel(); $('#test').textContent = t('testFail'); }
}
async function testPush() {
  const b = $('#test'); const reg = await sw(); const s = await reg.pushManager.getSubscription();
  if (!s || !S.prefs.on) { b.textContent = t('testFail'); return; }
  const r = await fetch(API + '/api/test', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ endpoint: s.endpoint, lang: S.lang }) }).catch(() => null);
  b.textContent = r && r.ok ? t('testSent') : t('testFail'); setTimeout(() => b.textContent = t('test'), 4000);
}

// ---- panel: åpne/lukke + dra igjen ----
const panel = $('#panel'), scrim = $('#scrim');
function openPanel(o) { panel.classList.toggle('open', o); scrim.classList.toggle('open', o); }
let drag = null;
panel.addEventListener('pointerdown', e => { if (e.target.closest('button,input')) return; drag = { x: e.clientX, t: performance.now(), dx: 0, vx: 0 }; panel.setPointerCapture(e.pointerId); });
panel.addEventListener('pointermove', e => { if (!drag) return; const dx = Math.max(0, e.clientX - drag.x); const now = performance.now(); drag.vx = (dx - drag.dx) / Math.max(1, now - drag.t); drag.dx = dx; drag.t = now; panel.classList.add('drag'); panel.style.transform = `translateX(${dx}px)`; });
panel.addEventListener('pointerup', e => { if (!drag) return; const close = drag.vx > 0.3 || (drag.dx > panel.offsetWidth * 0.4 && drag.vx >= 0); panel.classList.remove('drag'); panel.style.transform = ''; drag = null; openPanel(!close); });
panel.addEventListener('pointercancel', () => { panel.classList.remove('drag'); panel.style.transform = ''; drag = null; });

// ---- hendelser ----
$('#bell').onclick = () => openPanel(true);
$('#close').onclick = scrim.onclick = () => openPanel(false);
$('#swOn').onclick = toggleOn;
$('#swPlain').onclick = () => { S.prefs.plain = !S.prefs.plain; savePrefs(); };
$('#chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; const c = CHIPS[b.dataset.i]; const i = S.prefs.offsets.findIndex(o => o[0] === c[0]); if (i >= 0) { if (S.prefs.offsets.length > 1) S.prefs.offsets.splice(i, 1); } else S.prefs.offsets.push(c); savePrefs(); };
$('#test').onclick = testPush;
document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { S.theme = b.dataset.th; ls('theme', S.theme); applyTheme(); renderPanel(); });
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; ls('lang', S.lang); renderAll(); savePrefs(); });
$('#cal').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.nav) { const m = S.ym.m + Number(b.dataset.nav); S.ym = { y: S.ym.y + Math.floor(m / 12), m: (m + 12) % 12 }; renderCal(); }
  else if (b.dataset.d) { S.sel = b.dataset.d; renderCal(); } });
let sx = null; $('#cal').addEventListener('pointerdown', e => sx = e.clientX); $('#cal').addEventListener('pointerup', e => { if (sx !== null && Math.abs(e.clientX - sx) > 60) $('#cal').querySelector(`[data-nav="${e.clientX < sx ? 1 : -1}"]`).click(); sx = null; });
function selectDate(k) { const d = parse(k); S.sel = k; S.ym = { y: d.getFullYear(), m: d.getMonth() }; renderCal(); $('#cal').scrollIntoView({ behavior:'smooth', block:'start' }); }
$('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) selectDate(b.dataset.d); });
$('#hero').addEventListener('click', e => { const b = e.target.closest('.teaser'); if (b) selectDate(b.dataset.d); });
$('#cta').onclick = () => { location.hash = 'forslag'; };
$('#back').onclick = () => { history.length > 1 ? history.back() : (location.hash = ''); };
function route() { const f = location.hash === '#forslag'; $('#forslag').classList.toggle('on', f); $('#home').classList.toggle('on', !f); if (f) window.scrollTo(0, 0); }
addEventListener('hashchange', route);
$('#form').onsubmit = async e => { e.preventDefault(); const b = $('#send'); b.disabled = true; b.textContent = t('sending');
  const fd = Object.fromEntries(new FormData(e.target));
  const r = await fetch(API + '/api/suggest', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(fd) }).catch(() => null);
  if (r && r.ok) { e.target.innerHTML = `<div class="ok">${t('sent')}</div>`; } else { b.disabled = false; b.textContent = t('send'); $('#sNote').textContent = t('sErr'); } };

// ---- start ----
(async () => {
  applyTheme(); const d = today(); S.ym = { y: d.getFullYear(), m: d.getMonth() };
  try { const r = await fetch(API + '/api/events'); if (!r.ok) throw 0; S.events = await r.json(); } catch { S.events = SAMPLE; }
  S.sel = items()[0]?.date || null; if (S.sel) { const sd = parse(S.sel); S.ym = { y: sd.getFullYear(), m: sd.getMonth() }; }
  renderAll(); route();
  if ('serviceWorker' in navigator) { sw().then(async reg => { const s = await reg.pushManager.getSubscription(); if (S.prefs.on && !s) { S.prefs.on = false; ls('prefs', S.prefs); renderPanel(); } }); }
})();
</script>
