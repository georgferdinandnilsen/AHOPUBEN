// Tema settes før første tegning, ellers farger Safari topplinjen hvit og beholder den.
function sunTimes(date, lat = 59.91, lng = 10.75) { // SunCalc-formelen, kun opp/ned
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009, e = rad * 23.4397;
  const d = date.valueOf() / 864e5 - 0.5 + J1970 - J2000, lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds), L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)), Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const fromJ = j => new Date((j + 0.5 - J1970) * 864e5);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}
function applyTheme() {
  var th = null; try { th = JSON.parse(localStorage.getItem('theme')); } catch (e) {}

}

    const man = title => H.manuals.find(mm => new RegExp(title, 'i').test(mm.title));
    b.innerHTML = head(fmt(s.date, { weekday:'short', day:'numeric', month:'short' }).toUpperCase(), `${roleName(s.role)}, kl ${s.time}. ${s.event || s.pub || ''}`, true)
      + (s.obs ? `<div class="tcard"><span class="k">${t('obsK')}</span><p>${s.obs}</p></div>` : '')
      + `<div class="lbl2">${t('responsible')}</div>` + (s.responsible ? person(s.responsible, s.responsible.role) : `<p class="hint">${t('alone')}</p>`)
      + `<div class="lbl2">${t('workWith')}${s.role === 'resp' ? ', ' + roleName('open').toUpperCase() + ' 19-22' : ''}</div>` + (s.coworkers.length ? s.coworkers.map(p => person(p, roleName(s.coRole || s.role) + ' ' + (s.coRole === 'open' ? '19-22' : s.time))).join('') : `<p class="hint">${t('alone')}</p>`)
      + `<div class="lbl2">${t('otherTeam')}${roleName(s.otherRole).toUpperCase()} ${s.otherRole === 'open' ? '19-22' : '22-01'}</div>` + (s.others.length ? s.others.map(p => person(p)).join('') : `<p class="hint">${t('alone')}</p>`)
      + `<div style="display:flex;justify-content:space-between;gap:10px">${man('skifte vakt') ? `<button class="linkbtn" data-manual="${man('skifte vakt').id}">Skifte vakt ›</button>` : ''}${man(s.role === 'open' ? 'åpne' : 'låse') ? `<button class="linkbtn" data-manual="${man(s.role === 'open' ? 'åpne' : 'låse').id}">${man(s.role === 'open' ? 'åpne' : 'låse').title} ›</button>` : ''}</div>`;
    return; }
  if (v?.type === 'manual') { b.innerHTML = head(v.title || t('tabs')[1], t('manualsS'), true) + `<div class="manual" id="manualBody">${v.html || `<p class="muted">${t('loading')}</p>`}</div>`;
    if (!v.html) api('/api/member/manual/' + v.id).then(r => { if (S.view?.id === v.id) { S.view = { ...v, title: r.data.title || v.title, html: r.ok ? r.data.html : `<p class="muted">${t('errNet')}</p>` }; renderSheet(); } }); return; }
  if (v?.type === 'send') return renderSend(b);
  if (v?.type === 'log') return renderLog(b);
  if (v?.type === 'code') return renderCode(b);
  if (v?.type === 'stats') return renderStats(b);
  let html = head(t('hi') + first(S.member.name).toUpperCase(), up.length === 0 ? t('noShifts') : up.length === 1 ? t('oneShift') : up.length + t('nShifts')) + tabsHtml();
  if (S.tab === 'vakter') {
    const active = up.find(isActiveShift); const latest = H.messages.find(m => Date.now() - m.t < 48 * 3600e3);
    if (active && active.obs) html += `<div class="tcard bounce"><span class="k">${t('obsK')}</span><p>${active.obs}</p></div>`;
    else if (latest) html += `<button class="tcard" data-tab="meldinger"><span class="k">${t('fromBoard')}${fmt(new Date(latest.t), { day:'numeric', month:'short' }).toUpperCase()}</span><p>${latest.text}</p></button>`;
    const nx = active || up[0];
    if (nx) html += `<button class="scard" data-shift="${nx.id}"><span class="chip${active ? ' now' : ''}">${active ? t('nowShift') : t('nextShift')}</span><h3>${fmt(nx.date, { weekday:'short', day:'numeric', month:'short' })}</h3><span class="t">${roleName(nx.role)}, kl ${nx.time}</span><p>${shiftSub(nx)} ${t('tapDetail')}</p></button>`;
    html += up.filter(s => s !== nx).map(s => `<button class="srow" data-shift="${s.id}"><span class="d">${fmt(s.date, { day:'numeric', month:'short' })}</span><span class="t"><b>${roleName(s.role)}</b><span>Kl ${s.time}, ${s.event || s.pub || t('noProgramS')}</span></span><span class="a">›</span></button>`).join('');
    html += `<a class="wbtn" href="webcal://${location.host}/api/member/shifts.ics?t=${S.member.token}">${t('allCal')}</a><p class="hint">${t('calHint')}</p>`;
    html += `<div class="between"><span><b style="font-weight:700;font-size:14px;display:block">${t('shiftAlert')}</b><small class="hint">${t('shiftAlertS')}</small></span><button class="sw sm${S.prefs.shift !== false ? ' on' : ''}" data-shiftsw role="switch"></button></div>`;
    html += `<button class="linkbtn" data-logout>${t('logout')}</button>`;
  } else if (S.tab === 'manualer') {
    let g = -1; html += `<div>` + H.manuals.map(m => { const gap = m.group !== g && g >= 0 ? '<div class="mgap"></div>' : ''; g = m.group; return gap + `<button class="mrowm" data-manual="${m.id}">${m.title}<span>›</span></button>`; }).join('') + `</div>`;
  } else {
    html += `<div>` + (H.messages.length ? H.messages.map(m => `<div class="msg"><span class="k">${t('fromBoard')}${fmt(new Date(m.t), { day:'numeric', month:'short' }).toUpperCase()}</span><p>${m.text}</p>${S.member.board ? `<small>${m.sender}, ${m.seen} av ${m.count}${t('seenBy')}</small>` : ''}</div>`).join('') : `<p class="hint">${t('noMsgs')}</p>`) + `</div>`;
    const unseen = H.messages.filter(m => !m.seenByMe).map(m => m.id); if (unseen.length) { api('/api/member/seen', { ids: unseen }); H.messages.forEach(m => m.seenByMe = true); }
  }
  b.innerHTML = html; b.scrollTop = 0;
}
// styret
const counts = () => S.home?.counts || { all: 0, upcoming: 0, active: 0 };
function renderCode(b) { const v = S.view; b.innerHTML = head(t('chooseCode'), '', true) + `<p class="hint">${v.reset ? t('resetS') : t('chooseCodeS')}</p>` + (v.reset ? `<div class="lbl2">${t('tempCode')}</div><div class="codein"><input id="tempCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><div class="lbl2">${t('newCode')}</div>` : '') + `<div class="codein"><input id="newCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><button class="pbtn" id="saveCode">${t('saveCode')}</button><p class="hint err" id="codeErr" hidden></p>`;
  $('#saveCode').onclick = async () => { const code = $('#newCode').value.trim(), temp = $('#tempCode')?.value.trim(); if (!/^\d{4}$/.test(code)) { $('#codeErr').textContent = t('errPhone').replace(/telefonnummer|phone number/, 'kode'); $('#codeErr').hidden = false; return; } const r = await api('/api/board/code', { code, temp }); if (r.ok) { S.member.hasCode = true; ls('member', S.member); S.view = { type:'send' }; renderSheet(); toast('OK'); } else { $('#codeErr').textContent = r.data.error === 'need_temp' ? t('wrongCode') : t('errNet'); $('#codeErr').hidden = false; } }; }
function renderSend(b) {
  if (!S.member.hasCode) { S.view = { type:'code' }; return renderCode(b); }
  const v = S.view; v.to = v.to || 'all'; const c = counts();
  b.innerHTML = head(t('sendT').toUpperCase(), '', true) + `<div class="lbl2">${t('to')}</div><div class="chips">${[['all', t('toAll'), c.all], ['upcoming', t('toUp'), c.upcoming], ['active', t('toAct'), c.active]].map(([k, l, n]) => `<button data-to="${k}" class="${v.to === k ? 'on' : ''}">${l} (${n})</button>`).join('')}</div>`
    + `<div class="lbl2">${t('msg')}</div><textarea class="ta" id="msgText" maxlength="300">${v.text || ''}</textarea><div class="lbl2">${t('code')}</div><div class="codein"><input id="sendCode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div><button class="pbtn" id="sendBtn">${t('sendTo')}${c[v.to]}</button><p class="hint err" id="sendErr" hidden></p><button class="ghost" data-view="log">${t('seeLog')}</button><button class="ghost" data-view="stats">${t('seeStats')}</button><button class="linkbtn" id="resetBtn">${t('resetCode')}</button>`;
  b.querySelectorAll('[data-to]').forEach(x => x.onclick = () => { v.to = x.dataset.to; v.text = $('#msgText').value; renderSend(b); });
  $('#sendBtn').onclick = async () => { const text = $('#msgText').value.trim(), code = $('#sendCode').value.trim(); const err = $('#sendErr'); err.hidden = true; if (!text || !/^\d{4}$/.test(code)) { err.textContent = !text ? t('msg') + '?' : t('wrongCode'); err.hidden = false; return; } $('#sendBtn').disabled = true; $('#sendBtn').textContent = t('sending'); const r = await api('/api/board/send', { text, to: v.to, code }); if (r.ok) { toast(t('sentTo') + r.data.count + t('pushed') + r.data.pushed); v.text = ''; S.home = null; await loadHome(); S.view = { type:'log' }; renderSheet(); } else { $('#sendBtn').disabled = false; $('#sendBtn').textContent = t('sendTo') + c[v.to]; err.textContent = r.data.error === 'wrong_code' ? t('wrongCode') : t('errNet'); err.hidden = false; } };
  $('#resetBtn').onclick = async () => { const r = await api('/api/board/reset', {}); if (r.ok) { S.view = { type:'code', reset: true }; renderSheet(); } };
}
async function renderStats(b) { // tall for styret: besøk, innlogget, varsler og Hjem-skjerm. Bare antall, ingen navn.
  const top = head(t('statsT'), t('statsS'), true); b.innerHTML = top + `<p class="hint">${t('loading')}</p>`;
  const r = await api('/api/board/stats'); if (S.view?.type !== 'stats') return;
  if (!r.ok) { b.innerHTML = top + `<p class="hint err">${t('errNet')}</p>`; return; }
  const x = r.data, box = (n, l, sub) => `<div class="stat"><b>${n}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
  b.innerHTML = top + `<div class="lbl2">${t('statsVisit')}</div><div class="stats">${box(x.visitors.day, t('statsDay'))}${box(x.visitors.week, t('stats7'))}${box(x.visitors.month, t('stats30'), x.visitors.pc + ' ' + t('statsPc'))}</div>`
    + `<div class="lbl2">${t('statsUse')}</div><div class="stats">${box(x.loggedIn.people, t('statsIn'), x.loggedIn.devices + ' ' + t('statsDevs'))}${box(x.push.phones, t('statsPush'), x.push.members + ' ' + t('statsMem') + ', ' + x.push.week + ' ' + t('statsNew'))}${box(x.home.phones, t('statsHome'), x.home.week + ' ' + t('statsNew'))}</div><p class="hint">${t('statsNote')}</p>`;
}
async function renderLog(b) { b.innerHTML = head(t('logT'), t('logS'), true) + `<p class="hint">${t('loading')}</p>`; const r = await api('/api/board/log'); if (S.view?.type !== 'log') return; const toName = { all: t('toAll'), upcoming: t('toUp'), active: t('toAct') };
  b.innerHTML = head(t('logT'), t('logS'), true) + `<div>` + ((r.data.messages || []).map(m => `<div class="msg"><div style="display:flex;justify-content:space-between"><span class="k">${fmt(new Date(m.t), { day:'numeric', month:'short' }).toUpperCase()} ${pad(new Date(m.t).getHours())}:${pad(new Date(m.t).getMinutes())}</span><small>${m.seen} av ${m.count}${t('seenBy')}</small></div><b style="font-weight:700;font-size:13px">${m.sender} → ${toName[m.to] || m.to} (${m.count})</b><p>${m.text}</p></div>`).join('') || `<p class="hint">${t('noMsgs')}</p>`) + `</div>`; }
// klikk i arket
$('#sbody').addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-shift],[data-manual],[data-back],[data-close],[data-logout],[data-shiftsw],[data-view]'); if (!el) return;
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.view = null; renderSheet(); }
  else if (el.dataset.shift) { S.view = { type:'shift', id: el.dataset.shift }; renderSheet(); }
  else if (el.dataset.manual) { const m = S.home?.manuals.find(x => x.id === el.dataset.manual); S.view = { type:'manual', id: el.dataset.manual, title: m?.title || '' }; renderSheet(); }
  else if (el.dataset.view) { S.view = { type: el.dataset.view, from: S.view?.type }; renderSheet(); }
  else if (el.hasAttribute('data-back')) { S.view = S.view?.from ? { type: S.view.from } : S.view?.type === 'log' || S.view?.type === 'code' ? { type:'send' } : null; renderSheet(); }
  else if (el.hasAttribute('data-close')) openSheet(false);
  else if (el.hasAttribute('data-logout')) logout();
  else if (el.hasAttribute('data-shiftsw')) { S.prefs.shift = S.prefs.shift === false; savePrefs(); renderSheet(); }
});
// Feil lagret nummer: e-post → nytt nummer → lagres i Notion
$('#recLink').onclick = () => { $('#recModal').classList.add('open'); $('#recEmail').focus(); };
$('#recClose').onclick = () => { $('#recModal').classList.remove('open'); };
$('#recModal').addEventListener('click', e => { if (e.target === e.currentTarget) $('#recModal').classList.remove('open'); });
$('#recFind').onclick = async () => { recErr(''); const email = $('#recEmail').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return recErr(t('recEmailBad'));
  const b = $('#recFind'); b.disabled = true; const r = await api('/api/member/recover', { email }).catch(() => ({ ok:false, data:{} })); b.disabled = false;
  if (!r.ok) return recErr(r.data.error === 'not_found' ? t('recNotFound') : r.data.error === 'expired' ? t('errExpired') : t('errNet'));
  recToken = r.data.token; $('#recStep1').hidden = true; $('#recStep1').style.display = 'none'; $('#recCc').innerHTML = $('#cc').innerHTML; $('#recCc').value = $('#cc').value; $('#recStep2').hidden = false; $('#recStep2').style.display = 'flex'; $('#recPhone').focus(); };
$('#recSave').onclick = async () => { recErr(''); const raw = $('#recPhone').value.trim(), cc = $('#recCc').value; if (raw.replace(/\D/g, '').length < 6) return recErr(t('errPhone'));
  const pretty = raw.startsWith('+') || raw.startsWith('00') ? raw : '+' + cc + ' ' + raw.replace(/\D/g, '').replace(/^0/, '');
  const b = $('#recSave'); b.disabled = true; const r = await api('/api/member/recover/phone', { token: recToken, phone: pretty }).catch(() => ({ ok:false, data:{} })); b.disabled = false;
  if (!r.ok) return recErr(r.data.error === 'phone_taken' ? t('recTaken') : r.data.error === 'bad_phone' ? t('errPhone') : t('errNet'));
  resetRecover(); $('#loginErr').hidden = true; failedLogins = 0; sessionStorage.removeItem('failedLogins');
  setMember({ token: r.data.token, name: r.data.name, board: r.data.board, hasCode: r.data.hasCode }); await pullPrefs(); savePrefs(); await loadHome(); toast(t('hi') + first(S.member.name).toUpperCase()); };
$('#loginBtn').onclick = login; $('#phone').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#logoutBtn').onclick = logout;
$('#sendLink').onclick = () => { openPanel(false); openSheet(true, { type:'send' }); };
$('#statsLink').onclick = () => { openPanel(false); openSheet(true, { type:'stats' }); };

// ---- start ----
(async () => {
  applyTheme(); const d = today(); S.ym = { y: d.getFullYear(), m: d.getMonth() };
  fetch(API + '/api/settings').then(r => r.json()).then(x => { S.join = x.join !== false; renderPanel(); }).catch(() => {});
  try { // telefonen melder seg én gang om dagen, så styret kan se hvor mange som har lagt appen på Hjem-skjerm. Tilfeldig id, ingen navn.
    let did = localStorage.getItem('dev'); if (!did) { did = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('dev', did); }
    const sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true, day = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('pinged') !== day + (sa ? 's' : 'b')) { localStorage.setItem('pinged', day + (sa ? 's' : 'b')); fetch(API + '/api/ping', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ id: did, standalone: sa, pc: matchMedia('(hover: hover) and (pointer: fine)').matches }) }).catch(() => {}); }
  } catch (e) {}
  try { const r = await fetch(API + '/api/events'); if (!r.ok) throw 0; S.events = await r.json(); } catch { S.events = location.hostname === 'localhost' ? SAMPLE : []; }
  S.sel = items()[0]?.date || null; if (S.sel) { const sd = parse(S.sel); S.ym = { y: sd.getFullYear(), m: sd.getMonth() }; }
  renderAll(); route(); renderPill(); if (S.member) { loadHome(); pullPrefs(); } else loadCountries();
  if ('serviceWorker' in navigator) { sw().then(async reg => { const s = await reg.pushManager.getSubscription(); if (S.prefs.on && !s) { S.prefs.on = false; ls('prefs', S.prefs); renderPanel(); } }); }
})();
</script>
