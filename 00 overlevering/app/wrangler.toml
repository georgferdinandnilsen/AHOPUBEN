name = "aho-puben"
main = "src/index.js"
account_id = "77f20e19b9bd7a3edce234492a671146" # Puben@aho.no sin Cloudflare-konto
# Appen svarer på pubens eget domene. Cloudflare lager DNS og sertifikat selv.
routes = [
  { pattern = "ahopuben.no", custom_domain = true },
  { pattern = "www.ahopuben.no", custom_domain = true },
]
workers_dev = true # reserveadresse: aho-puben.aho-puben-app.workers.dev
compatibility_date = "2026-10-01"

# Appen (public/) serveres av samme Worker som API-et: én deploy, samme opprinnelse.
[assets]
directory = "./public"
binding = "ASSETS"

# Lager KV-navnerom med: npx wrangler kv namespace create KV  → lim inn id under.
[[kv_namespaces]]
binding = "KV"
id = "dca6ff3b0c344bac9e0a011740273863"

# Kjører hver hele time. Worker-en regner selv ut Oslo-tid.
[triggers]
# MIDLERTIDIG AV under flyttingen: den gamle appen på Georgs konto sender fortsatt varsler. Settes tilbake til ["0 * * * *"] når den er stoppet.
crons = []

[vars]
VAPID_SUBJECT = "https://github.com/georgferdinandnilsen/AHOPUBEN"
# Medlemsdelen: datakilder i Notion (ikke hemmelige). Finnes med «Administrer datakilder» i Notion, eller i Worker-loggen.
NOTION_MEMBERS_DS = "306fc4bc-274d-805a-ac7b-000be7246563"
NOTION_BOARD_DS = "306fc4bc-274d-8016-89e6-000b2ed287c9"
NOTION_SHIFTS_DS = "306fc4bc-274d-8027-b822-000b6d1128c8"
NOTION_INFO_PAGE = "306fc4bc274d800493aaf22d1526a320"

# Hemmeligheter settes med: npx wrangler secret put NAVN
#   NOTION_TOKEN, NOTION_DB_ID, NOTION_SUGGEST_DB_ID, DEEPL_KEY, VAPID_PUBLIC, VAPID_PRIVATE
